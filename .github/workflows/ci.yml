name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run core, integration and HTTP black-box tests
        run: |
          $tempPath = Join-Path $env:RUNNER_TEMP "spacefit-pytest-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $tempPath) { throw 'Refusing to reuse pytest basetemp.' }
          python -B -m pytest test/backend -q -p no:cacheprovider `
            --ignore=test/backend/test_blender_integration.py `
            --ignore=test/backend/test_colmap_docker_integration.py `
            --ignore=test/backend/test_openmvs_docker_integration.py `
            --basetemp "$tempPath" --junitxml=artifacts/ci/backend/results.xml
          if ($LASTEXITCODE -ne 0) { throw 'Backend tests failed.' }
          ./tools/Assert-JUnit.ps1 -Path 'artifacts/ci/backend/*.xml'
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: backend-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/backend/*.xml
          if-no-files-found: warn
          retention-days: 7

  android:
    name: Android tests and APK
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" `
            'platform-tools' 'platforms;android-36.1' 'build-tools;36.1.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK setup failed.' }
      - name: Run unit tests, lint and build debug APKs
        run: |
          ./gradlew.bat :app:testDebugUnitTest :app:lintDebug :app:assembleDebug `
            :app:assembleDebugAndroidTest --no-daemon --max-workers=2 --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Android build or tests failed.' }
          ./tools/Assert-JUnit.ps1 -Path 'apps/android/build/test-results/testDebugUnitTest/TEST-*.xml'
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/build/test-results/testDebugUnitTest/TEST-*.xml
            apps/android/build/reports/lint-results-debug.xml
            apps/android/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 7
      - name: Upload debug APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: spacefit-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/android/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  gate:
    name: CI gate
    if: always()
    needs: [backend, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BACKEND_RESULT: ${{ needs.backend.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - name: Require both jobs to pass
        shell: bash
        run: |
          if [[ "$BACKEND_RESULT" != success || "$ANDROID_RESULT" != success ]]; then
            echo 'CI failed: backend and Android must both succeed.'
            exit 1
          fi
          echo 'Base CI passed. Native reconstruction and device acceptance are separate.'
